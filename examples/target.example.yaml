# Copy to target.yaml (gitignored) and fill in. Use `cmmrun probes` to see serials.
probe:
  serial: 123456789          # required: the J-Link to use, by serial number
  allow_onboard: false       # J-Links built into dev kits are refused unless true

# Probes that must never be opened. Keep machine-wide ones in ~/.cmmrun/probes.yaml
# (same key); both lists apply.
deny_serials: []

device: STM32F407VG          # J-Link device name (J-Link Commander: `?` lists them)
cpu_map: {}                  # optional: SYStem.CPU name -> J-Link device name
interface: swd               # swd | jtag
speed: 4000                  # kHz, auto or adaptive; SYStem.JtagClock overrides it
min_vtref_mv: 1000           # below this the target counts as unpowered (exit 3)
# dll: C:/Program Files/SEGGER/JLink_V818/JLink_x64.dll
